<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Lifesciential LTD. | Corporate Supply Catalog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand">
        <span class="brand-accent">MATT</span> LIFESCIENTIAL
      </a>
      <a href="https://wa.me/2348154715953?text=Hello%20Matt%20Lifesciential%20LTD.%2C%20I%20have%20a%20general%20inquiry." 
         target="_blank" id="nav-wa-link" class="nav-wa-btn">
        <i class="fa-brands fa-whatsapp"></i>
        <span>Direct Sales</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <span class="hero-badge">STORE</span>
      <h1>Precision Engineering & Infrastructure</h1>
      <p>Browse enterprise security, high-yield solar arrays, and certified building materials. Select any product to connect directly with sales.</p>
    </div>
  </section>

  <section class="controls-section">
    <div class="container">
      <div class="dropdown-wrapper">
        <button id="dropdown-btn" class="dropdown-trigger" aria-expanded="false" aria-haspopup="true">
          <span class="dropdown-trigger-text">
            <i class="fa-solid fa-layer-group"></i>
            <span id="selected-category-text">All Products</span>
          </span>
          <div class="dropdown-right">
            <span class="badge" id="selected-count">0</span>
            <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
          </div>
        </button>
        
        <div id="dropdown-menu" class="dropdown-menu">
          <button class="dropdown-item active" data-category="all">
            <span>All Products</span>
            <span class="badge" id="count-all">0</span>
          </button>
          <button class="dropdown-item" data-category="security">
            <span>Security Systems</span>
            <span class="badge" id="count-security">0</span>
          </button>
          <button class="dropdown-item" data-category="solar">
            <span>Solar Energy</span>
            <span class="badge" id="count-solar">0</span>
          </button>
          <button class="dropdown-item" data-category="building">
            <span>Building Materials</span>
            <span class="badge" id="count-building">0</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <main class="container store-main">
    <div class="product-grid" id="product-grid">
    </div>
  </main>

  <a href="https://wa.me/2348154715953?text=Hello%20Matt%20Lifesciential%20LTD.%2C%20I%20would%20like%20to%20make%20an%20inquiry." 
     target="_blank" id="floating-wa-link" class="floating-wa" aria-label="Quick WhatsApp Inquiry">
    <div class="wa-tooltip">Chat with Sales</div>
    <div class="wa-pulse"></div>
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 Matt Lifesciential LTD. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
